<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pares tipográficos do Google Fonts, escolhidos por rede neural e aplicados em dezenas de composições." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="/pairs.json" as="fetch" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-mono-latin.woff" as="font" type="font/woff" crossorigin />
  <title>2FONTS</title>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header id="topbar">
    <!-- A marca embutida, e não em `<img>`: um pedido de rede a mais para 1,6KB
         que o HTML já podia carregar, e que chegaria depois do primeiro quadro —
         o canto ficaria vazio e a marca apareceria atrasada. Inline ela também
         herda a cor do texto, então o tom continua saindo do CSS.
         `role="img"` + `aria-label` no contêiner: o leitor de tela ouve o nome
         em vez de tentar descrever um caminho vetorial. -->
    <div id="brand" role="img" aria-label="2fonts">
      <svg viewBox="0 0 718 239" aria-hidden="true" focusable="false"><path fill="currentColor" d="M282.139 0C317.551 6.11781e-05 337.114 21.2974 337.114 58.1953V180.528C337.114 217.179 317.303 238.724 282.139 238.724C246.726 238.724 227.658 217.179 227.658 180.528V58.1953C227.658 21.2973 246.974 0 282.139 0ZM55.9658 0C84.9394 0 104.503 17.0876 104.503 42.3467V68.8438C104.503 126.296 41.6036 171.366 41.6035 207.769H106.979V236.247H0V224.855C9.54348e-05 152.793 67.6051 118.867 67.6055 76.7686V48.042C67.6054 35.4129 61.4144 30.9553 53.4902 30.9551C44.823 30.9551 38.1359 36.8984 38.1357 48.5371V88.6553H2.72363V47.2998C2.72363 19.5644 21.0491 0.000119709 55.9658 0ZM212.761 34.4229H165.957V100.294H209.294V132.487H165.957V236.247H128.812V2.22949H212.761V34.4229ZM437.89 131.249H440.366L438.137 67.8535V2.22949H473.054V236.247H436.899L400.249 94.3506H398.02L399.753 154.031V236.247H365.084V2.22949H405.201L437.89 131.249ZM598.995 34.4229H562.345V236.247H525.199V34.4229H488.549V2.22949H598.995V34.4229ZM661.247 0C696.164 0.000119709 714.489 19.5644 714.489 47.2998V88.6553H679.077V48.5371C679.077 36.8984 672.39 30.9551 663.723 30.9551C655.799 30.9553 649.607 35.4129 649.607 48.042V76.7686C649.608 118.867 717.213 152.793 717.213 224.855V236.247H610.233V207.769H675.609C675.609 171.366 612.71 126.296 612.71 68.8438V42.3467C612.71 17.0876 632.273 0 661.247 0ZM282.634 32.4414C272.481 32.4414 265.547 40.1178 265.547 52.252V186.472C265.547 198.606 272.48 206.283 282.386 206.283C292.539 206.283 299.474 198.606 299.474 186.472V52.252C299.474 40.1178 292.787 32.4414 282.634 32.4414Z"/></svg>
    </div>
    <div id="pair-meta" aria-live="polite">
      <span id="name-a">—</span>
      <span aria-hidden="true">+</span>
      <span id="name-b">—</span>
    </div>
  </header>

  <div id="stage">
    <main id="field" aria-label="Composições aplicando o par tipográfico"></main>
  </div>

  <!-- Editor de amostra. Independente dos cards: divide com eles só o par de
       fontes ativo. O corpo do painel é montado em ui/editor.ts porque os pesos
       oferecidos dependem da família — só entra na tela a faixa que ela tem. -->
  <aside id="editor" aria-label="Editor de amostra">
    <div id="editor-body" class="editor__body"></div>
    <button id="editor-handle" class="editor__handle" type="button"
            aria-expanded="false" aria-controls="editor-body">
      <span class="editor__grip" aria-hidden="true"></span>
      <span class="editor__handle-label">texto</span>
    </button>
  </aside>

  <p id="hint" aria-hidden="true">role para navegar</p>

  <!-- A vitrine. Era uma fileira horizontal na base; virou uma coluna na borda
       DIREITA — o editor já ocupa a esquerda, e os dois painéis do mesmo lado
       disputariam a mesma faixa de tela. Em pé cada item deixa de ser um chip
       de 150px e vira um card: as duas fontes escritas com o próprio primeiro
       nome, em corpo grande, que é o que se está de fato escolhendo. -->
  <aside id="gallery" aria-label="Pares disponíveis neste recorte">
    <!-- O trilho do corte encabeça a coluna, e é o único elemento dela que não
         rola: os cards passam POR BAIXO dele. Ficava numa barra própria no
         rodapé, que existia só para carregá-lo depois que a prateleira subiu
         para cá — uma faixa de 92px atravessando a tela inteira para segurar um
         controle de 300px. Agora ele governa a lista de onde a lista está.

         Anatomia do `PreviewSlider` do react-bits: trilho como role="slider",
         com preenchimento, marcas e o cursor na borda do preenchimento. O input
         nativo saiu porque o desenho pede TEXTO dentro do trilho, o que nenhum
         ::-webkit-slider-* permite; o teclado e o ARIA vêm à mão em controls.ts. -->
    <div id="dock" role="group" aria-label="Controles">
      <div class="scrubber">
        <div id="contrast" class="scrubber__track" role="slider" tabindex="0"
             aria-label="Contraste de medida entre título e texto"
             aria-valuemin="1" aria-valuemax="10" aria-valuenow="6">
          <!-- Marcas ANTES do preenchimento: assim ele as cobre, e elas só
               aparecem no vão que falta — como no original. -->
          <div class="scrubber__ticks" aria-hidden="true"></div>
          <div class="scrubber__fill" aria-hidden="true"></div>
          <div class="scrubber__thumb" aria-hidden="true"></div>
          <div id="contrast-value" class="scrubber__value num" aria-hidden="true">6/10</div>
        </div>
      </div>
    </div>

    <div id="shelf-wrap">
      <div id="shelf" role="group" aria-label="Pares disponíveis neste recorte"></div>
    </div>
  </aside>

  <!-- Troca de par. Fica calado para o leitor de tela: quem anuncia a mudança é
       o #pair-meta, que é `aria-live` e diz os nomes das duas fontes. -->
  <div id="busy" aria-hidden="true"><span class="busy__ring"></span></div>

  <div id="loading" role="status" aria-live="polite">escolhendo o primeiro par…</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
