<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pares tipográficos do Google Fonts, escolhidos por rede neural e aplicados em dezenas de composições." />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="/pairs.json" as="fetch" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-mono-latin.woff" as="font" type="font/woff" crossorigin />
  <title>twofonts</title>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header id="topbar">
    <div id="brand" aria-label="twofonts">two<span>fonts</span></div>
    <div id="pair-meta" aria-live="polite">
      <span id="name-a">—</span>
      <span aria-hidden="true">+</span>
      <span id="name-b">—</span>
    </div>
  </header>

  <div id="stage">
    <main id="field" aria-label="Composições aplicando o par tipográfico"></main>
    <button id="prev" class="nav nav--prev" type="button" aria-label="Par anterior deste corte">
      <span aria-hidden="true">←</span>
    </button>
    <button id="next" class="nav nav--next" type="button" aria-label="Próximo par deste corte">
      <span aria-hidden="true">→</span>
    </button>
  </div>

  <p id="hint" aria-hidden="true">role para navegar</p>

  <div id="shelf-wrap">
    <div id="shelf" role="group" aria-label="Pares disponíveis neste recorte"></div>
  </div>

  <div id="dock" role="group" aria-label="Controles">
    <label class="dock__label" for="contrast">harmonia</label>
    <div id="contrast-wrap">
      <input id="contrast" type="range" min="0" max="9" step="1" value="5"
             list="contrast-steps" aria-label="Contraste entre as duas fontes" />
      <datalist id="contrast-steps">
        <option value="0"></option><option value="1"></option><option value="2"></option>
        <option value="3"></option><option value="4"></option><option value="5"></option>
        <option value="6"></option><option value="7"></option><option value="8"></option>
        <option value="9"></option>
      </datalist>
      <div id="contrast-ticks" aria-hidden="true"></div>
    </div>
    <span class="dock__label" aria-hidden="true">contraste</span>
    <button id="generate" type="button" title="Sorteia corte e par (tecla espaço)">
      sortear <kbd>espaço</kbd>
    </button>
    <button id="share" type="button">copiar link</button>
  </div>

  <div id="loading" role="status" aria-live="polite">escolhendo o primeiro par…</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
