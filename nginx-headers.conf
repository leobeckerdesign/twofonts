# Cabeçalhos de segurança, num arquivo à parte por uma regra do nginx: uma
# diretiva `add_header` dentro de um `location` DESCARTA todas as herdadas do
# nível de cima. Como cada location aqui declara o próprio `Cache-Control`, os
# cabeçalhos escritos uma vez no `server` sumiriam de todas as respostas do
# site — que é o modo silencioso de não ter política de segurança nenhuma.
# Incluindo o arquivo em cada location, eles voltam a valer em todas.
#
# `always` em todos: sem ele o nginx omite o cabeçalho nas respostas de erro,
# que são justamente as páginas onde um conteúdo injetado apareceria.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# A CSP.
#
# `style-src` e `script-src` aceitam `unsafe-inline` por uma razão concreta: a
# página do case é um arquivo ÚNICO e autocontido, com o CSS e o JS embutidos,
# porque ela precisa abrir offline com duplo clique — e ela é servida daqui
# dentro, num `<iframe>` de mesma origem, então a política desta resposta vale
# para ela. O motor do palco também escreve `style` inline a cada quadro.
#
# O que isso custa é pouco neste site: não há back-end, não há autenticação, não
# há cookie e nada do que a pessoa digita sai do navegador. O único dado que
# entra pela URL são dois nomes de família, e eles são procurados no catálogo
# antes de virar qualquer coisa — nome que não está lá é descartado, nunca
# escrito na página.
#
# `fonts.googleapis.com` serve a folha de cada família pedida; a folha aponta
# para `fonts.gstatic.com`, que é de onde o arquivo da fonte vem de fato. Por
# isso um está em `style-src` e o outro em `font-src`.
#
# `static.cloudflareinsights.com` é o beacon do Web Analytics, que a Cloudflare
# INJETA na resposta por conta própria quando a zona tem a medição ligada. Sem a
# origem liberada ele era bloqueado e o site ficava sem números — os outros
# domínios da casa não passam por isso só porque não declaram CSP nenhuma. O
# beacon devolve os dados para `/cdn-cgi/rum`, no próprio domínio, então
# `connect-src 'self'` já cobre a volta e nenhuma outra origem precisa entrar.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
