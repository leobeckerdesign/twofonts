# Servidor do site estático.
#
# Duas coisas moram aqui: a política de cache, que separa o que o Vite versiona
# pelo nome do que ele apenas copia, e a inclusão dos cabeçalhos de segurança,
# que vivem em `nginx-headers.conf` e precisam ser repetidos em cada location —
# o porquê está lá.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A versão do nginx no cabeçalho `Server` só serve para quem procura versão
  # vulnerável.
  server_tokens off;

  # ---------- compressão ----------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_proxied any;
  # `pairs.json` são 115KB de números e nomes de família: comprime a menos de um
  # terço. Fonte e imagem ficam de fora — woff2, jpg e png já vêm comprimidos, e
  # recomprimir gasta CPU para crescer o arquivo.
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # ---------- cache ----------
  #
  # O Vite assina o nome do arquivo com o hash do conteúdo. Nome novo a cada
  # mudança significa que o antigo NUNCA precisa ser revalidado: `immutable`
  # poupa a ida e volta que só devolveria 304.
  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # O que vem de `public/` mantém o nome entre um build e outro — a fonte da
  # interface, os cinco JPEGs dos cards e a página do case. Sem hash no nome,
  # `immutable` serviria conteúdo velho até o ano que vem. Uma semana com
  # revalidação obrigatória no fim é o meio-termo: o navegador não pede nada
  # durante a visita, e uma troca chega em dias.
  location ~* \.(?:woff2?|jpe?g|png|gif|webp|avif|svg|ico)$ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    access_log off;
  }

  # O catálogo de pares é o dado do site, e o que mais provavelmente muda sem que
  # o resto mude junto. Uma hora.
  location = /pairs.json {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  }

  # O HTML nunca fica em cache: é ele que aponta para os nomes assinados, e um
  # `index.html` velho pediria um pacote que não existe mais.
  location / {
    include /etc/nginx/snippets/headers.conf;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }
}
