<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>twofonts — palco de cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@600&family=Playfair+Display:wght@700&family=Fraunces:opsz,wght@9..144,700&family=Instrument+Serif&family=Syne:wght@700&family=DM+Serif+Display&family=Bricolage+Grotesque:wght@700&family=Archivo+Black&family=Roboto:wght@400&family=Inter:wght@400&family=IBM+Plex+Sans:wght@400&family=Manrope:wght@400&family=DM+Sans:wght@400&family=Work+Sans:wght@400&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
<style>
:root {
  --bg: #0b0b0d;
  --paper: #e9e5dd;
  --ink: #131310;
  --muted: #8a877f;
  --line: rgba(233, 229, 221, 0.13);
  --accent: #f05524;
}
:root[data-theme="light"] {
  --bg: #dedad2;
  --paper: #f7f5f1;
  --ink: #131310;
  --muted: #6e6b63;
  --line: rgba(19, 19, 16, 0.16);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  display: flex; flex-direction: column;
  transition: background .5s ease;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 26px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--muted); pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.topbar b { color: var(--paper); font-weight: 500; letter-spacing: .24em; }
:root[data-theme="light"] .topbar b { color: var(--ink); }
.ghost {
  background: none; border: 1px solid var(--line); color: var(--muted);
  font: inherit; font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  padding: 7px 13px; cursor: pointer; transition: .2s;
}
.ghost:hover { color: var(--paper); border-color: var(--paper); }
:root[data-theme="light"] .ghost:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- campo de cards ---------- */
#field { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.card {
  position: absolute; background: var(--paper); color: var(--ink);
  padding: 34px 36px 30px; cursor: grab; will-change: transform;
  box-shadow: 0 24px 60px rgba(0,0,0,.34);
  display: flex; flex-direction: column;
}
.card:active { cursor: grabbing; }
.card--ink { background: var(--ink); color: var(--paper); }
.card--accent { background: var(--accent); color: #14120f; }
.tag {
  font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .18em;
  text-transform: uppercase; opacity: .5; margin-bottom: 18px;
}
.fam { line-height: .92; letter-spacing: -0.025em; }
.fox { line-height: 1.08; margin-top: 14px; }
.para { line-height: 1.55; margin-top: 16px; opacity: .82; }
.rule { height: 1px; background: currentColor; opacity: .18; margin: 18px 0; }
.cols { column-count: 2; column-gap: 26px; }
.btn {
  display: inline-block; margin-top: 18px; padding: 11px 22px;
  border: 1px solid currentColor; font-size: 13px; letter-spacing: .04em;
}
.eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: .55; }
.wf div { line-height: 1.06; margin-bottom: 6px; }
.meta { display: flex; flex-direction: column; gap: 14px; font-family: "IBM Plex Mono", monospace; }
.meta b { font-weight: 500; font-size: 13px; letter-spacing: .04em; }
.meta small { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; opacity: .5; display: block; margin-bottom: 3px; }

/* ---------- prateleira + controles ---------- */
.dock { position: relative; z-index: 15; flex: none; background: var(--bg); border-top: 1px solid var(--line); }
:root[data-theme="light"] .dock { background: var(--bg); }
.shelf-head {
  display: flex; gap: 12px; padding: 13px 26px 0;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
}
.shelf-head .slot { color: var(--accent); cursor: pointer; }
.shelf { display: flex; gap: 4px; padding: 10px 26px 16px; overflow-x: auto; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.cand {
  flex: none; width: 128px; padding: 14px 14px 11px; border: 1px solid transparent;
  background: none; color: var(--paper); cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, background .2s;
}
:root[data-theme="light"] .cand { color: var(--ink); }
.cand:hover { border-color: var(--line); }
.cand.on { border-color: var(--accent); }
.cand .aa { font-size: 34px; line-height: .95; }
.cand .nm { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand.on .nm { color: var(--accent); }
.controls {
  display: flex; align-items: center; justify-content: center; gap: 20px;
  padding: 13px 26px 18px; border-top: 1px solid var(--line);
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.lock { background: none; border: 1px solid var(--line); color: var(--muted); font: inherit;
  font-size: 10px; letter-spacing: .16em; padding: 8px 14px; cursor: pointer; transition: .2s; }
.lock:hover { color: var(--paper); border-color: var(--paper); }
:root[data-theme="light"] .lock:hover { color: var(--ink); border-color: var(--ink); }
.lock.on { color: var(--accent); border-color: var(--accent); }
.slider { display: flex; align-items: center; gap: 10px; }
input[type=range] { width: 150px; accent-color: var(--accent); }
.gen { background: var(--accent); border: 1px solid var(--accent); color: #14120f; font: inherit;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase; padding: 10px 26px; cursor: pointer; }
.gen:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<div class="topbar">
  <b>twofonts</b>
  <button class="ghost" id="theme">claro / escuro</button>
</div>

<div id="field"></div>

<div class="dock">
  <div class="shelf-head">candidatos para
    <span class="slot" id="slotLabel">headline</span>
    <span style="opacity:.5">— clique para trocar de slot</span>
  </div>
  <div class="shelf" id="shelf"></div>
  <div class="controls">
    <button class="lock" id="lA">travar A</button>
    <div class="slider"><span>harmonia</span><input type="range" id="c" min="0" max="1" step="0.01" value="0.5"><span>contraste</span></div>
    <button class="lock" id="lB">travar B</button>
    <button class="gen" id="gen">gerar</button>
  </div>
</div>

<script>
const HEAD = ["Oswald","Playfair Display","Fraunces","Instrument Serif","Syne","DM Serif Display","Bricolage Grotesque","Archivo Black"];
const BODY = ["Roboto","Inter","IBM Plex Sans","Manrope","DM Sans","Work Sans","Source Serif 4"];
const W = { "Oswald":600,"Playfair Display":700,"Fraunces":700,"Instrument Serif":400,"Syne":700,
            "DM Serif Display":400,"Bricolage Grotesque":700,"Archivo Black":400 };

const FOX = "The quick brown fox who jumped over a lazy dog.";
const PARA = "Uma tem a voz, a outra tem o argumento. O pareamento funciona quando as duas compartilham esqueleto e discordam no gesto — proporção parecida, temperamento oposto.";

let slot = "a", a = "Oswald", b = "Roboto", lockA = false, lockB = false;
const $ = (id) => document.getElementById(id);
const field = $("field");

/* cada card é um layout diferente do MESMO par. left/top em %, w em px. */
const LAYOUTS = [
  { id:"nome",  x:-4,  y:6,  w:520, kind:"paper",
    html:() => `<div class="tag">${a} + ${b}</div>
      <div class="fam" style="font-size:76px">${a}</div>
      <div class="fox" style="font-size:30px">${FOX}</div>
      <div class="para" style="font-size:15px">${PARA}</div>` },

  { id:"poster", x:41, y:-6, w:430, kind:"ink",
    html:() => `<div class="tag">pôster</div>
      <div class="fam" style="font-size:104px">Aa</div>
      <div class="fox" style="font-size:26px">${FOX}</div>` },

  { id:"editorial", x:74, y:14, w:470, kind:"paper",
    html:() => `<div class="tag">editorial</div>
      <div class="fam" style="font-size:52px">Beleza é função</div>
      <div class="rule"></div>
      <div class="para cols" style="font-size:13.5px">${PARA} ${PARA}</div>` },

  { id:"interface", x:12, y:56, w:400, kind:"paper",
    html:() => `<div class="eyebrow" style="font-family:'${b}',sans-serif">Interface</div>
      <div class="fam" style="font-size:40px;margin-top:10px">Assinatura visual</div>
      <div class="para" style="font-size:14px">${PARA.slice(0, 118)}…</div>
      <div class="btn" style="font-family:'${b}',sans-serif">continuar</div>` },

  { id:"waterfall", x:47, y:47, w:490, kind:"accent",
    html:() => `<div class="tag">escala</div>
      <div class="wf">
        <div class="fam" style="font-size:58px">Beleza é função</div>
        <div class="fam" style="font-size:38px">Beleza é função</div>
        <div class="fam" style="font-size:25px">Beleza é função</div>
      </div>
      <div class="para" style="font-size:13px;margin-top:14px">${PARA.slice(0, 96)}…</div>` },

  { id:"ficha", x:84, y:62, w:330, kind:"ink",
    html:() => `<div class="tag">ficha</div>
      <div class="meta">
        <div><small>headline</small><b id="mA">${a}</b></div>
        <div><small>corpo</small><b id="mB">${b}</b></div>
        <div><small>contraste</small><b>${Math.round($("c").value * 100)}%</b></div>
      </div>` },
];

let cards = [];

function build() {
  field.innerHTML = "";
  cards = LAYOUTS.map((L) => {
    const el = document.createElement("div");
    el.className = "card" + (L.kind === "ink" ? " card--ink" : L.kind === "accent" ? " card--accent" : "");
    el.style.width = L.w + "px";
    el.style.left = L.x + "%";
    el.style.top = L.y + "%";
    el.dataset.id = L.id;
    field.appendChild(el);
    return { el, L };
  });
  paint();
  if (window.Draggable) Draggable.create(cards.map((c) => c.el), { bounds: null, inertia: false });
  drift();
}

function paint() {
  for (const { el, L } of cards) {
    el.innerHTML = L.html();
    // A pinta títulos/nomes; B pinta textos corridos.
    el.querySelectorAll(".fam, .fox, .wf .fam").forEach((n) => {
      n.style.fontFamily = `"${a}", serif`;
      n.style.fontWeight = W[a] || 700;
    });
    el.querySelectorAll(".para").forEach((n) => { n.style.fontFamily = `"${b}", sans-serif`; });
  }
  shelf();
}

let driftTweens = [];

/* drift usa y absoluto (0 → N → 0). y relativo brigava com a timeline de troca
   e deixava os cards presos em opacity 0. */
function drift() {
  driftTweens = cards.map(({ el }, i) =>
    gsap.to(el, { y: 9 + (i % 3) * 7, duration: 4.5 + i * 0.7,
      repeat: -1, yoyo: true, ease: "sine.inOut", delay: i * 0.4 }));
}

function regenerate() {
  const els = cards.map((c) => c.el);
  driftTweens.forEach((t) => t.kill());
  gsap.killTweensOf(els);

  // Aba oculta congela requestAnimationFrame: sem isso a timeline para no
  // primeiro frame e os cards ficam invisíveis até a aba voltar.
  if (document.hidden) {
    gsap.set(els, { opacity: 1, y: 0, scale: 1 });
    paint();
    return;
  }

  const tl = gsap.timeline({ onComplete: drift });
  tl.to(els, { opacity: 0, y: 24, scale: .975, duration: .28, stagger: .04, ease: "power2.in" });
  tl.add(paint);
  tl.fromTo(els,
    { opacity: 0, y: 24, scale: .975 },
    { opacity: 1, y: 0, scale: 1, duration: .5, stagger: .055, ease: "power3.out" });
}

function shelf() {
  const list = slot === "a" ? HEAD : BODY;
  const cur = slot === "a" ? a : b;
  $("slotLabel").textContent = slot === "a" ? "headline" : "corpo";
  $("shelf").innerHTML = list.map((f) => `
    <button class="cand ${f === cur ? "on" : ""}" data-f="${f}">
      <span class="aa" style="font-family:'${f}',serif;font-weight:${slot === "a" ? (W[f] || 700) : 400}">Aa</span>
      <span class="nm">${f}</span>
    </button>`).join("");
  [...document.querySelectorAll(".cand")].forEach((el) => {
    el.onclick = () => { slot === "a" ? (a = el.dataset.f) : (b = el.dataset.f); regenerate(); };
  });
}

$("slotLabel").onclick = () => { slot = slot === "a" ? "b" : "a"; shelf(); };
$("lA").onclick = () => { lockA = !lockA; $("lA").classList.toggle("on", lockA); };
$("lB").onclick = () => { lockB = !lockB; $("lB").classList.toggle("on", lockB); };
$("c").oninput = () => paint();
$("gen").onclick = () => {
  if (!lockA) a = HEAD[Math.floor(Math.random() * HEAD.length)];
  if (!lockB) b = BODY[Math.floor(Math.random() * BODY.length)];
  regenerate();
};
$("theme").onclick = () => {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
};
addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.target.isContentEditable) { e.preventDefault(); $("gen").click(); }
});

document.fonts.ready.then(build);
</script>
</body>
</html>
