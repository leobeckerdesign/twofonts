<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>twofonts — campo com scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@600&family=Playfair+Display:wght@700&family=Fraunces:opsz,wght@9..144,700&family=Instrument+Serif&family=Syne:wght@700&family=DM+Serif+Display&family=Bricolage+Grotesque:wght@700&family=Archivo+Black&family=Roboto:wght@400&family=Inter:wght@400&family=IBM+Plex+Sans:wght@400&family=Manrope:wght@400&family=DM+Sans:wght@400&family=Work+Sans:wght@400&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Observer.min.js"></script>
<style>
:root {
  --bg: #0b0b0d; --paper: #e9e5dd; --ink: #131310;
  --muted: #8a877f; --line: rgba(233,229,221,.13); --accent: #f05524;
}
:root[data-theme="light"] { --bg: #dedad2; --paper: #f7f5f1; --muted: #6e6b63; --line: rgba(19,19,16,.16); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--paper);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  display: flex; flex-direction: column; transition: background .5s ease;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex;
  justify-content: space-between; align-items: center; padding: 18px 26px;
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.topbar b { color: var(--paper); font-weight: 500; letter-spacing: .24em; }
:root[data-theme="light"] .topbar b { color: var(--ink); }
.ghost { background: none; border: 1px solid var(--line); color: var(--muted); font: inherit;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase; padding: 7px 13px; cursor: pointer; }
.ghost:hover { color: var(--paper); border-color: var(--paper); }

.hint {
  position: fixed; left: 50%; bottom: 214px; transform: translateX(-50%); z-index: 18;
  font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  opacity: .7; pointer-events: none; transition: opacity .5s;
}
.hint.gone { opacity: 0; }

/* Três camadas aninhadas, cada uma dona de UMA transform:
   .slot = scroll · .par = ponteiro + proximidade · .card = flutuação idle. */
#field { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.slot { position: absolute; top: 0; left: 0; will-change: transform; }
.par { will-change: transform; }
/* Escala base do card: cresce largura E tipografia juntas, sem precisar
   reescrever os tamanhos px de cada layout. */
.zoom { transform-origin: top left; }
.card {
  background: var(--paper); color: var(--ink); padding: 30px 32px 26px;
  box-shadow: 0 26px 64px rgba(0,0,0,.36); display: flex; flex-direction: column;
  will-change: transform;
}
.card--ink { background: var(--ink); color: var(--paper); }
.card--accent { background: var(--accent); color: #14120f; }

.tag { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; opacity: .5; margin-bottom: 14px; }
.fam { line-height: .92; letter-spacing: -.025em; }
.fox { line-height: 1.08; margin-top: 12px; }
.para { line-height: 1.55; margin-top: 14px; opacity: .82; }
.rule { height: 1px; background: currentColor; opacity: .18; margin: 15px 0; }
.cols { column-count: 2; column-gap: 22px; }
.btn { display: inline-block; margin-top: 15px; padding: 10px 20px; border: 1px solid currentColor;
  font-size: 13px; letter-spacing: .04em; }
.eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: .55; }
.wf div { line-height: 1.06; margin-bottom: 4px; }
.meta { display: flex; flex-direction: column; gap: 12px; }
.meta b { font-weight: 500; font-size: 13px; letter-spacing: .04em; }
.meta small { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; opacity: .5;
  display: block; margin-bottom: 3px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
  padding: 7px 0; border-bottom: 1px solid currentColor; }
.row:last-child { border-bottom: none; }
.num { font-variant-numeric: tabular-nums; opacity: .55; }
.split { display: flex; gap: 20px; }
.split > div { flex: 1; }
.stamp { display: inline-block; border: 1px solid currentColor; padding: 5px 10px;
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase; }
.center { text-align: center; }

/* ---------- dock ---------- */
.dock { position: relative; z-index: 15; flex: none; background: var(--bg); border-top: 1px solid var(--line); }
.shelf-head { display: flex; gap: 12px; padding: 13px 26px 0; font-size: 10px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.shelf-head .slot-btn { color: var(--accent); cursor: pointer; }
.shelf { display: flex; gap: 4px; padding: 10px 26px 16px; overflow-x: auto; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.cand { flex: none; width: 126px; padding: 13px 13px 10px; border: 1px solid transparent;
  background: none; color: var(--paper); cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 8px; transition: border-color .2s; }
:root[data-theme="light"] .cand { color: var(--ink); }
.cand:hover { border-color: var(--line); }
.cand.on { border-color: var(--accent); }
.cand .aa { font-size: 33px; line-height: .95; }
.cand .nm { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand.on .nm { color: var(--accent); }
.controls { display: flex; align-items: center; justify-content: center; gap: 20px;
  padding: 13px 26px 18px; border-top: 1px solid var(--line);
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.lock { background: none; border: 1px solid var(--line); color: var(--muted); font: inherit;
  font-size: 10px; letter-spacing: .16em; padding: 8px 14px; cursor: pointer; }
.lock.on { color: var(--accent); border-color: var(--accent); }
.slider { display: flex; align-items: center; gap: 10px; }
input[type=range] { width: 150px; accent-color: var(--accent); }
.gen { background: var(--accent); border: 1px solid var(--accent); color: #14120f; font: inherit;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase; padding: 10px 26px; cursor: pointer; }
</style>
</head>
<body>

<div class="topbar">
  <b>twofonts</b>
  <button class="ghost" id="theme">claro / escuro</button>
</div>

<div id="field"></div>
<div class="hint" id="hint">role para navegar</div>

<div class="dock">
  <div class="shelf-head">candidatos para
    <span class="slot-btn" id="slotLabel">headline</span>
    <span style="opacity:.5">— clique para trocar de slot</span>
  </div>
  <div class="shelf" id="shelf"></div>
  <div class="controls">
    <button class="lock" id="lA">travar A</button>
    <div class="slider"><span>harmonia</span><input type="range" id="c" min="0" max="1" step="0.01" value="0.5"><span>contraste</span></div>
    <button class="lock" id="lB">travar B</button>
    <button class="gen" id="gen">gerar</button>
  </div>
</div>

<script>
const HEAD = ["Oswald","Playfair Display","Fraunces","Instrument Serif","Syne","DM Serif Display","Bricolage Grotesque","Archivo Black"];
const BODY = ["Roboto","Inter","IBM Plex Sans","Manrope","DM Sans","Work Sans","Source Serif 4"];
const W = { "Oswald":600,"Playfair Display":700,"Fraunces":700,"Instrument Serif":400,"Syne":700,
            "DM Serif Display":400,"Bricolage Grotesque":700,"Archivo Black":400 };
const FOX = "The quick brown fox who jumped over a lazy dog.";
const PARA = "Uma tem a voz, a outra tem o argumento. O pareamento funciona quando as duas compartilham esqueleto e discordam no gesto — proporção parecida, temperamento oposto.";

let slot = "a", a = "Oswald", b = "Roboto", lockA = false, lockB = false;
const $ = (id) => document.getElementById(id);
const field = $("field");
const pct = () => Math.round($("c").value * 100);

/* 18 layouts do MESMO par. `A` pinta títulos (.fam/.fox), `B` pinta texto (.para). */
const LAYOUTS = [
  { kind:"paper", w:500, html:() => `<div class="tag">${a} + ${b}</div>
      <div class="fam" style="font-size:70px">${a}</div>
      <div class="fox" style="font-size:27px">${FOX}</div>
      <div class="para" style="font-size:15px">${PARA}</div>` },

  { kind:"ink", w:390, html:() => `<div class="tag">pôster</div>
      <div class="fam" style="font-size:96px">Aa</div>
      <div class="fox" style="font-size:24px">${FOX}</div>` },

  { kind:"paper", w:450, html:() => `<div class="tag">editorial</div>
      <div class="fam" style="font-size:48px">Beleza é função</div><div class="rule"></div>
      <div class="para cols" style="font-size:13px">${PARA} ${PARA}</div>` },

  { kind:"paper", w:370, html:() => `<div class="eyebrow" style="font-family:'${b}',sans-serif">Interface</div>
      <div class="fam" style="font-size:36px;margin-top:9px">Assinatura visual</div>
      <div class="para" style="font-size:14px">${PARA.slice(0,108)}…</div>
      <div class="btn" style="font-family:'${b}',sans-serif">continuar</div>` },

  { kind:"accent", w:460, html:() => `<div class="tag">escala</div><div class="wf">
      <div class="fam" style="font-size:52px">Beleza é função</div>
      <div class="fam" style="font-size:35px">Beleza é função</div>
      <div class="fam" style="font-size:23px">Beleza é função</div></div>
      <div class="para" style="font-size:13px;margin-top:12px">${PARA.slice(0,88)}…</div>` },

  { kind:"ink", w:320, html:() => `<div class="tag">ficha</div><div class="meta">
      <div><small>headline</small><b>${a}</b></div>
      <div><small>corpo</small><b>${b}</b></div>
      <div><small>contraste</small><b>${pct()}%</b></div></div>` },

  { kind:"paper", w:420, html:() => `<div class="tag">citação</div>
      <div class="fam" style="font-size:42px">“Forma que<br/>conversa.”</div>
      <div class="para" style="font-size:14px">${PARA.slice(0,124)}…</div>` },

  { kind:"paper", w:480, html:() => `<div class="tag">alfabeto</div>
      <div class="fam" style="font-size:31px">ABCDEFGHIJKLM<br/>NOPQRSTUVWXYZ</div>
      <div class="para" style="font-size:14px;margin-top:12px">abcdefghijklmnopqrstuvwxyz 0123456789</div>` },

  /* ---------- os dez novos ---------- */

  { kind:"ink", w:400, html:() => `<div class="tag">numerais</div>
      <div class="fam num" style="font-size:64px">0123456789</div>
      <div class="rows para" style="font-size:13px;margin-top:14px">
        <div class="row"><span>Corpo do texto</span><span class="num">16 / 1.6</span></div>
        <div class="row"><span>Entrelinha</span><span class="num">1.55</span></div>
        <div class="row"><span>Contraste</span><span class="num">${pct()}%</span></div>
      </div>` },

  { kind:"accent", w:360, html:() => `<div class="tag">convite</div>
      <div class="fam" style="font-size:44px">Noite de<br/>Tipografia</div>
      <div class="para" style="font-size:13px;margin-top:12px">Quinta, 20h · Rua da Consolação, 1200</div>
      <div class="stamp" style="margin-top:14px;font-family:'${b}',sans-serif">entrada franca</div>` },

  { kind:"paper", w:430, html:() => `<div class="tag">índice</div>
      <div class="rows" style="font-size:15px">
        <div class="row"><span class="fam">Anatomia</span><span class="num para">012</span></div>
        <div class="row"><span class="fam">Contraste</span><span class="num para">034</span></div>
        <div class="row"><span class="fam">Ritmo</span><span class="num para">058</span></div>
        <div class="row"><span class="fam">Hierarquia</span><span class="num para">081</span></div>
      </div>` },

  { kind:"ink", w:340, html:() => `<div class="tag">capa</div>
      <div class="fam" style="font-size:46px">O peso<br/>da forma</div>
      <div class="rule"></div>
      <div class="para" style="font-size:13px">Ensaios sobre tipografia aplicada</div>
      <div class="para" style="font-size:11px;margin-top:22px;letter-spacing:.16em;text-transform:uppercase">Edições Palco</div>` },

  { kind:"paper", w:470, html:() => `<div class="tag">manchete</div>
      <div class="eyebrow" style="font-family:'${b}',sans-serif">Caderno de Design</div>
      <div class="fam" style="font-size:40px;margin-top:8px">A fonte certa não se nota</div>
      <div class="para cols" style="font-size:12.5px">${PARA}</div>` },

  { kind:"paper", w:380, html:() => `<div class="tag">verbete</div>
      <div class="fam" style="font-size:40px">pareamento</div>
      <div class="para" style="font-size:13px;margin-top:6px;opacity:.6">pa·re·a·men·to · substantivo</div>
      <div class="para" style="font-size:14px">Ato de combinar duas formas que se sustentam sem disputar a mesma atenção.</div>` },

  { kind:"accent", w:440, html:() => `<div class="tag">comparativo</div>
      <div class="split">
        <div><div class="para" style="font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 8px">A</div>
          <div class="fam" style="font-size:30px">Hamburgefonstiv</div></div>
        <div><div class="para" style="font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 8px">B</div>
          <div class="para" style="font-size:24px;line-height:1.1;opacity:1">Hamburgefonstiv</div></div>
      </div>
      <div class="para" style="font-size:12px;margin-top:14px">${PARA.slice(0,84)}…</div>` },

  { kind:"paper", w:350, html:() => `<div class="tag">etiqueta</div>
      <div class="fam" style="font-size:38px">Café<br/>Torrado</div>
      <div class="rule"></div>
      <div class="para" style="font-size:12px">Origem única · Torra média · Moagem fina</div>
      <div class="para num" style="font-size:12px;margin-top:6px">250 g ℮</div>` },

  { kind:"ink", w:490, html:() => `<div class="tag">hero</div>
      <div class="fam" style="font-size:54px">Componha<br/>com intenção</div>
      <div class="para" style="font-size:14px">${PARA.slice(0,96)}…</div>
      <div style="display:flex;gap:10px">
        <div class="btn" style="font-family:'${b}',sans-serif">começar</div>
        <div class="btn" style="font-family:'${b}',sans-serif;opacity:.55">ver exemplos</div>
      </div>` },

  { kind:"paper", w:330, html:() => `<div class="tag">legenda</div>
      <div class="fam" style="font-size:26px">Detalhe da haste</div>
      <div class="para" style="font-size:11.5px">${PARA.slice(0,150)}…</div>
      <div class="para" style="font-size:9px;margin-top:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.55">fig. 04 — ${a} / ${b}</div>` },
];

/* Faixa horizontal como fração 0..1 do espaço DISPONÍVEL (já descontadas as
   margens e a largura do card), então nenhum card encosta na borda. */
const LANES = [.04,.62,.30,.86,.16,.70,.44,.02,.78,.36,.58,.10,.92,.24,.66,.48,.82,.14];
/* No celular só existem dois lados: cada card cai à esquerda ou à direita,
   com folga variável, e a sobreposição vertical faz o entrelace. */
const LANES_MOBILE = [0,1,.12,.88,0,1,.18,.82,.06,.94,0,1,.15,.85,.04,.96,.1,.9];

const REF_W = 1440, REF_H = 820;   // viewport de projeto
const SPACING_BASE = 240;
const AMP = { large: 9, medium: 17, small: 27 };
const tierOf = (w) => (w >= 460 ? "large" : w >= 380 ? "medium" : "small");

/* Recalculados a cada resize: tudo escala junto com o viewport. */
let SCALE = 1.3, MARGIN = 56, spacingNow = SPACING_BASE, isMobile = false;

function metrics() {
  const fw = field.clientWidth, fh = field.clientHeight;
  isMobile = fw < 720;

  if (isMobile) {
    // Alvo: card ocupando ~55% da largura, para caberem dois lados sobrepostos.
    SCALE = gsap.utils.clamp(0.3, 0.72, fw / 780);
    MARGIN = Math.max(12, 20 * SCALE);
    spacingNow = Math.round(SPACING_BASE * SCALE * 1.15);
  } else {
    // Média geométrica das duas dimensões: `min` deixava o card pequeno demais
    // em tela larga, `max` estouraria a altura. O teto por altura impede que um
    // card fique mais alto que a área visível numa tela larga e baixa.
    const geo = Math.sqrt((fw / REF_W) * (fh / REF_H));
    SCALE = gsap.utils.clamp(0.8, 3.2, Math.min(1.3 * geo, fh / 520));
    // A margem acompanha a escala, senão o parallax (27 * SCALE) vazaria pela borda.
    MARGIN = Math.max(24, 44 * SCALE);
    // Quanto mais larga a tela, mais cards cabem lado a lado: aproxima na
    // vertical para o campo não ficar vazio nas pontas.
    const density = gsap.utils.clamp(1, 1.7, (fw / fh) / (REF_W / REF_H));
    spacingNow = Math.round(SPACING_BASE * (fh / REF_H) * 1.3 / density);
  }
  total = slots.length * spacingNow;
}

let slots = [], scroll = 0, target = 0, total = 0;
const pointer = { tx: 0, ty: 0, x: 0, y: 0, px: -9999, py: -9999, inside: false };

function build() {
  field.innerHTML = "";
  slots = LAYOUTS.map((L, i) => {
    const holder = document.createElement("div");
    holder.className = "slot";
    const par = document.createElement("div");
    par.className = "par";
    const zoom = document.createElement("div");
    zoom.className = "zoom";
    const card = document.createElement("div");
    card.className = "card" + (L.kind === "ink" ? " card--ink" : L.kind === "accent" ? " card--accent" : "");
    zoom.appendChild(card);
    par.appendChild(zoom);
    holder.appendChild(par);
    field.appendChild(holder);
    return { holder, par, zoom, card, L, i,
             tier: tierOf(L.w), base: 0, w: L.w, h: 300, near: 0 };
  });
  paint();
  layout();
  floatIdle();
  render();
}

/* Larguras e posições horizontais: calculadas aqui e no resize, nunca no loop.
   O card encolhe se não couber na tela com as duas margens. */
function layout() {
  metrics();
  const fw = field.clientWidth;
  const room = Math.max(140, fw - MARGIN * 2);
  const lanes = isMobile ? LANES_MOBILE : LANES;

  for (const s of slots) {
    // O card mantém sua largura de projeto; quem cresce é o .zoom. Se o
    // resultado não couber entre as margens, a escala cede — nunca a margem.
    const k = Math.min(SCALE, room / s.L.w);
    s.card.style.width = s.L.w + "px";
    s.zoom.style.transform = `scale(${k.toFixed(4)})`;

    s.w = s.L.w * k;
    s.h = (s.card.offsetHeight || 300) * k;
    s.holder.style.width = s.w + "px";
    s.lane = lanes[s.i % lanes.length];
    s.x = MARGIN + s.lane * (fw - s.w - MARGIN * 2);
    s.base = s.i * spacingNow;
  }
}

function floatIdle() {
  slots.forEach(({ card }, i) => {
    gsap.to(card, { y: 7 + (i % 3) * 5, x: (i % 2 ? 4 : -4), duration: 4.2 + (i % 5) * 0.8,
      repeat: -1, yoyo: true, ease: "sine.inOut", delay: i * 0.28 });
  });
}

function paint() {
  for (const s of slots) {
    s.card.innerHTML = s.L.html();
    s.card.querySelectorAll(".fam, .fox").forEach((n) => {
      n.style.fontFamily = `"${a}", serif`; n.style.fontWeight = W[a] || 700;
    });
    s.card.querySelectorAll(".para").forEach((n) => { n.style.fontFamily = `"${b}", sans-serif`; });
  }
  shelf();
}

/* Topo e base podem cortar — é a rolagem acontecendo. As laterais, nunca:
   quem garante isso é o cálculo de `s.x` em layout(). */
function render() {
  scroll += (target - scroll) * 0.09;
  pointer.x += (pointer.tx - pointer.x) * 0.09;
  pointer.y += (pointer.ty - pointer.y) * 0.09;

  for (const s of slots) {
    const y = gsap.utils.wrap(-(s.h + MARGIN * 2), total - (s.h + MARGIN * 2), s.base - scroll);
    // Sem cursor não há parallax de ponteiro; no celular ele só empurraria o
    // card para fora da margem estreita.
    const amp = isMobile ? 0 : AMP[s.tier] * SCALE;
    const px = amp * pointer.x;
    const py = amp * pointer.y;

    s.holder.style.transform = `translate3d(${s.x}px, ${y}px, 0)`;

    let want = 0;
    if (pointer.inside) {
      const cx = s.x + s.w / 2 + px;
      const cy = y + s.h / 2 + py;
      want = gsap.utils.clamp(0, 1, 1 - Math.hypot(pointer.px - cx, pointer.py - cy) / (440 * SCALE));
    }
    s.near += (want - s.near) * 0.12;

    s.par.style.transform =
      `translate(${px.toFixed(2)}px, ${py.toFixed(2)}px) scale(${(1 + s.near * 0.035).toFixed(4)})`;
    s.card.style.zIndex = String(Math.round(s.near * 100));
  }
  requestAnimationFrame(render);
}

function shelf() {
  const list = slot === "a" ? HEAD : BODY;
  const cur = slot === "a" ? a : b;
  $("slotLabel").textContent = slot === "a" ? "headline" : "corpo";
  $("shelf").innerHTML = list.map((f) => `
    <button class="cand ${f === cur ? "on" : ""}" data-f="${f}">
      <span class="aa" style="font-family:'${f}',serif;font-weight:${slot === "a" ? (W[f] || 700) : 400}">Aa</span>
      <span class="nm">${f}</span>
    </button>`).join("");
  [...document.querySelectorAll(".cand")].forEach((el) => {
    el.onclick = () => { slot === "a" ? (a = el.dataset.f) : (b = el.dataset.f); swap(); };
  });
}

function swap() {
  const cards = slots.map((s) => s.card);
  const tl = gsap.timeline({ onComplete: layout });
  tl.to(cards, { opacity: 0, duration: .24, stagger: .02, ease: "power2.in" });
  tl.add(paint);
  tl.to(cards, { opacity: 1, duration: .42, stagger: .028, ease: "power3.out" });
}

$("slotLabel").onclick = () => { slot = slot === "a" ? "b" : "a"; shelf(); };
$("lA").onclick = () => { lockA = !lockA; $("lA").classList.toggle("on", lockA); };
$("lB").onclick = () => { lockB = !lockB; $("lB").classList.toggle("on", lockB); };
$("c").oninput = () => { paint(); layout(); };
$("gen").onclick = () => {
  if (!lockA) a = HEAD[Math.floor(Math.random() * HEAD.length)];
  if (!lockB) b = BODY[Math.floor(Math.random() * BODY.length)];
  swap();
};
$("theme").onclick = () => {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
};

document.fonts.ready.then(() => {
  build();

  Observer.create({
    target: window, type: "wheel,touch",
    onChangeY: (self) => { target += self.deltaY * 1.6; $("hint").classList.add("gone"); },
  });

  field.addEventListener("pointermove", (e) => {
    const r = field.getBoundingClientRect();
    pointer.tx = gsap.utils.mapRange(0, r.width, 1, -1, e.clientX - r.left);
    pointer.ty = gsap.utils.mapRange(0, r.height, 1, -1, e.clientY - r.top);
    pointer.px = e.clientX - r.left;
    pointer.py = e.clientY - r.top;
    pointer.inside = true;
  }, { passive: true });

  field.addEventListener("pointerleave", () => {
    pointer.inside = false; pointer.tx = 0; pointer.ty = 0;
  });

  addEventListener("resize", layout);
});
</script>
</body>
</html>
