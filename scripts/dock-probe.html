<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8" /><title>sonda do dock</title></head>
<body>
<pre id="out" style="position:relative;z-index:1;background:#fff">rodando</pre>
<script type="module">
/**
 * Sonda da lente da vitrine.
 *
 * O efeito é uma mola integrada a cada frame, escrita direto em `transform`.
 * Nada disso aparece em teste unitário: depende de layout real, de ponteiro e
 * de tempo passando. Aqui a pergunta é objetiva — o card sob o cursor cresce
 * mais que os vizinhos, os vizinhos abrem espaço para os lados, e tudo volta
 * ao lugar quando o ponteiro sai.
 *
 * O eixo virou o VERTICAL junto com a vitrine, e com ele o pico: numa fileira
 * de chips o card crescia 28%, numa coluna de cards cresce 6% — 28% de 300px
 * seriam 84px saltando por cima do campo. Os limites daqui acompanham essa
 * mudança de escala; o que se cobra continua sendo a forma da lente, não o
 * número.
 */
const out = document.getElementById("out");
const L = [];
const say = (s) => { L.push(s); out.textContent = L.join("\n"); };
let falhas = 0;
const check = (nome, cond, detalhe = "") => {
  if (!cond) falhas++;
  say(`${cond ? "  ok " : "FALHA"} ${nome.padEnd(46)} ${detalhe}`);
};

try {
  const f = document.createElement("iframe");
  // DENTRO da viewport de proposito. Fora dela o Chrome nao renderiza o
  // frame, e sem render nao ha `requestAnimationFrame` — todo efeito por
  // frame (o dock, as timelines do GSAP) ficaria inerte e a sonda mediria
  // um app pela metade. O `<pre>` do resultado fica por cima.
  f.style.cssText = "width:1440px;height:820px;border:0;position:fixed;left:0;top:0;z-index:0";
  f.src = "/";
  document.body.appendChild(f);
  await new Promise((r) => { f.onload = r; });
  const d = f.contentDocument;
  const w = f.contentWindow;
  await d.fonts.ready;
  for (let i = 0; i < 120 && !d.querySelector(".chip"); i++) await new Promise((r) => setTimeout(r, 100));
  await new Promise((r) => setTimeout(r, 1500));

  const shelf = d.getElementById("shelf");
  const chips = [...d.querySelectorAll(".chip")];
  const pausa = (ms) => new Promise((r) => setTimeout(r, ms));

  // `m.d` e `m.f`: a escala e o deslocamento do eixo Y, que é onde a lente
  // trabalha desde que a vitrine ficou em pé.
  const lerTransform = (el) => {
    const m = new w.DOMMatrix(w.getComputedStyle(el).transform);
    return { escala: m.d, desloca: m.f };
  };

  say(`AMBIENTE`);
  say(`   hover fino          : ${w.matchMedia("(hover: hover) and (pointer: fine)").matches}`);
  say(`   movimento reduzido  : ${w.matchMedia("(prefers-reduced-motion: reduce)").matches}`);
  say(`   cards na coluna     : ${chips.length}`);

  // Aponta para o centro do 3º card: fundo o bastante na pilha para ter vizinho
  // dos dois lados, e ainda dentro da janela de 820px.
  const alvo = chips[2];
  const r = alvo.getBoundingClientRect();
  const shelfR = shelf.getBoundingClientRect();
  shelf.dispatchEvent(new w.PointerEvent("pointermove", {
    bubbles: true, clientX: shelfR.left + shelfR.width / 2, clientY: r.top + r.height / 2,
  }));
  await pausa(700);

  const t = chips.map(lerTransform);
  say(`\nCOM O PONTEIRO NO CARD 3`);
  for (let i = 0; i < Math.min(8, chips.length); i++) {
    say(`   card ${i}  escala=${t[i].escala.toFixed(3)}  desloca=${t[i].desloca.toFixed(1)}px`);
  }

  check("o card sob o cursor cresceu", t[2].escala > 1.04, `escala=${t[2].escala.toFixed(3)}`);
  check("   e é o MAIOR de todos", t.every((x, i) => i === 2 || x.escala <= t[2].escala + 1e-6));
  check("vizinho imediato cresce menos", t[1].escala > 1.005 && t[1].escala < t[2].escala,
    `${t[1].escala.toFixed(3)} < ${t[2].escala.toFixed(3)}`);
  check("card distante fica no tamanho", Math.abs(t[6].escala - 1) < 0.01, `escala=${t[6].escala.toFixed(3)}`);
  check("vizinho de cima abre para cima", t[1].desloca < -0.5, `${t[1].desloca.toFixed(1)}px`);
  check("vizinho de baixo abre para baixo", t[3].desloca > 0.5, `${t[3].desloca.toFixed(1)}px`);
  check("o card sob o cursor quase não anda", Math.abs(t[2].desloca) < 6, `${t[2].desloca.toFixed(1)}px`);

  // A mola tem de assentar, senão o ticker nunca dorme.
  const antes = chips.map(lerTransform);
  await pausa(500);
  const depois = chips.map(lerTransform);
  const parou = antes.every((x, i) => Math.abs(x.escala - depois[i].escala) < 0.002);
  check("a mola assenta em vez de oscilar", parou);

  shelf.dispatchEvent(new w.PointerEvent("pointerleave", { bubbles: true }));
  await pausa(900);
  const fim = chips.map(lerTransform);
  check("ao sair, tudo volta ao tamanho", fim.every((x) => Math.abs(x.escala - 1) < 0.01),
    `maior=${Math.max(...fim.map((x) => x.escala)).toFixed(3)}`);
  check("   e ao lugar", fim.every((x) => Math.abs(x.desloca) < 1),
    `maior=${Math.max(...fim.map((x) => Math.abs(x.desloca))).toFixed(1)}px`);

  say(`\nTOTAL ${falhas}`);
} catch (err) {
  say(`ERRO: ${err && err.stack ? err.stack : String(err)}`);
  say("TOTAL 99");
}
</script>
</body>
</html>
